name: Проверка скрипта

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка синтаксиса Bash
        run: bash -n nuvrion-auto-tuning.sh
      - name: Установка ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Проверка ShellCheck (ошибки и предупреждения)
        run: shellcheck -x --severity=warning nuvrion-auto-tuning.sh
      - name: Информационные замечания ShellCheck
        run: shellcheck -x --severity=info nuvrion-auto-tuning.sh
      - name: Регрессионные тесты
        run: python3 -m unittest discover -s tests -v
      - name: Контрольная сумма
        run: sha256sum -c SHA256SUMS

  release:
    needs: validate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Публикация новой версии
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha256sum -c SHA256SUMS
          if gh release view "v$version" >/dev/null 2>&1; then exit 0; fi
          gh release create "v$version" --target "$GITHUB_SHA" \
            --title "Nuvrion Auto Tuning $version" --notes-file RELEASE_NOTES.md \
            nuvrion-auto-tuning.sh SHA256SUMS
